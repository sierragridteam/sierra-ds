name: Publish
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false
  queue: max

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm check
      - run: pnpm build
      # npm handles OIDC publishing; pnpm remains the project package manager.
      - run: npm install --global npm@12.2.2
      # The first publication must exist before automatic releases can start.
      - run: node scripts/wait-for-registry.mjs
      - id: release
        run: node scripts/prepare-release.mjs
      - if: steps.release.outputs.publish == 'true'
        run: npm publish --access public --provenance --ignore-scripts
        working-directory: packages/design-system
      # Hold the release queue until npm exposes this version to the next run.
      - if: steps.release.outputs.publish == 'true'
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: node scripts/wait-for-registry.mjs "$RELEASE_VERSION"
