name: Publish
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false
  queue: max

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm check
      - run: pnpm build
      # npm handles OIDC publishing; pnpm remains the project package manager.
      - run: npm install --global npm@12.2.2
      # The first publication must exist before automatic releases can start.
      - run: node scripts/wait-for-registry.mjs
      - id: release
        run: node scripts/prepare-release.mjs
      - if: steps.release.outputs.publish == 'true'
        run: npm publish --access public --provenance --ignore-scripts
        working-directory: packages/design-system
      # Hold the release queue until npm exposes this version to the next run.
      - if: steps.release.outputs.publish == 'true'
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: node scripts/wait-for-registry.mjs "$RELEASE_VERSION"
