name: Publish
# Publishes only what CI passed: it runs when CI completes on a push to main,
# for the commit CI tested. A merge that changes nothing under
# packages/design-system (tests, demo, docs) publishes nothing; see
# scripts/prepare-release.mjs. workflow_dispatch on main retries a release.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false
  queue: max

jobs:
  publish:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          # The whole history: the release compares this commit with the last
          # published one.
          fetch-depth: 0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm check
      - run: pnpm build
      # npm handles OIDC publishing; pnpm remains the project package manager.
      - run: npm install --global npm@12.2.2
      # The first publication must exist before automatic releases can start.
      - run: node scripts/wait-for-registry.mjs
      - id: release
        env:
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: node scripts/prepare-release.mjs
      - if: steps.release.outputs.publish == 'true'
        run: npm publish --access public --provenance --ignore-scripts
        working-directory: packages/design-system
      # Hold the release queue until npm exposes this version to the next run.
      - if: steps.release.outputs.publish == 'true'
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: node scripts/wait-for-registry.mjs "$RELEASE_VERSION"
